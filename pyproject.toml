[project]
name = "cqupt-cas"
version = "0.1.0"
description = "重庆邮电大学 统一身份认证平台 SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.13.5",
    "lxml>=6.1.0",
    "pycryptodome>=3.23.0",
    "requests>=2.33.1",
]


[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
